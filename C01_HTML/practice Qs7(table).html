<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in Html</title>
</head>
<body>
    <table border="black">
        <caption>A test table with merged cells</caption>
        <thead>
            <Tr>
              <td rowspan="2"></td>
              <td colspan="2">Average</td>
              <td rowspan="2">Red eyes</td>
            </Tr>
            <Tr>
                <td>Height</td>
                <td>Weight</td>
            </Tr>
          
        </thead> 

            <tbody>
            <Tr>
                <td>Males</td>
                <td>1.9</td>
                <td>0.003</td>
                <td>40%</td>
            </Tr>
            <Tr>
                <td>Females</td>
                <td>1.7</td>
                <td>0.002</td>
                <td>43%</td>
            </Tr>
        </tbody>
    </table>
</body>
</html>
