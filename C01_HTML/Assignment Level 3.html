<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <table border="black">
        <caption>Student Information</caption>
        <tr>
            <th rowspan="6">Info</th>
            <th rowspan="2">Name</th>
            <th colspan="2">Address</th>
        </tr>
        <tr>
            <th>City</th>
            <th>House</th>
        </tr>
        <tr>
            <td>A</td>
            <td>Delhi</td>
            <td>1</td>
            
        </tr>
        <tr>
            <td>B</td>
            <td>Mumbai</td>
            <td>2</td>
            
        </tr>
        <tr>
            <td>C</td>
            <td>Kolkata</td>
            <td>3</td>
            
        </tr>
        <tr>
            <td>D</td>
            <td>Pune</td>
            <td>4</td>
            
        </tr>
    </table>
</body>
<br>
<hr>
<body>
    <form action="/server">
        <div>
        <label for="name">Name: </label>
        <input type="text" name="Name" id="name">
        </div>
        <br>
        <div>
            <label for="gender">Sex: </label>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
        </div>
        <br>
        <div>
            <label for="country">Country: </label>
            <select name="country" id="country">
                <option value="">Select an Option</option>
                <option value="India">India</option>
                <option value="Africa">Africa</option>
                <option value="Australia">Australia</option>
                <option value="Korea">South Korea</option>
            </select>
        </div>
        <br>
        <div>
            <label for="message">Message: </label>
            <textarea name="MEssage" id="message"></textarea>
        </div>
        <br>
        <div>
            <input type="checkbox" name="subscriber" id="subscribe">
            <label for="subscribe">Subscribe?</label>
        </div>
        <br>
        <div>
            <button>Submit</button>
        </div>
    </form>
    <br>
    <hr>
    <form action="/server.http">
        <header><h1>Feedback Form</h1></header>
        <div>
            <label for="name">Name: </label>
            <input type="text" name="name" id="name" placeholder="Write your name">
        </div>
        <br>
        <div>
            <label for="email">Email: </label>
            <input type="text" name="email" id="email" placeholder="Write your email">
        </div>
        <br>
        <div>
            <label for="feedback">Message: </label><br>
            <textarea name="feedback" id="feedback" rows="5" cols="30"></textarea>
        </div>
        <br>
        <div>
            <label for="rating">Rate us out of 5: </label>
            <br>
            <label for="1">1</label>
            <input type="radio" name="1" id="1"><br>
            <label for="2">2</label>
            <input type="radio" name="2" id="2"><br>
            <label for="3">3</label>
            <input type="radio" name="3" id="3"><br>
            <label for="4">4</label>
            <input type="radio" name="4" id="4"><br>
            <label for="5">5</label>
            <input type="radio" name="5" id="5"><br>
        </div>
        <br>
        <button>Send your message!</button>
    </form>
</body>
</html>
