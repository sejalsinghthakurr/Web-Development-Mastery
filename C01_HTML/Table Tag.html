<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>
<body>
    <table border="black"> <!--should not be used frequently-->
        <caption><h3><b> Report Card</b></h3></caption>
          <thead>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
                <th>Grade</th>
            </tr>
          </thead>
          <tbody>
            <tr>
                <td>English</td>
                <td>90</td>
                <td>A+</td>  
            </tr>
            <tr>
                <td>Hindi</td>
                <td>85</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Maths</td>
                <td>75</td>
                <td>B+</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>80</td>
                <td>A</td>
            </tr>
           </tbody>
    </table>
    <br>
    <table border="black">
         <caption><h3><b>Result</b></h3></caption>
         <thead>
         <tr>
           <th rowspan="2">Subjects</th>
           <th colspan="2">Marks</th>
         </tr>
         <tr>
            <th>Numbers</th>
            <th>Grades</th>
         </tr>
         </thead>
         <tbody>
            <tr>
                <td>English</td>
                <td>90</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>Hindi</td>
                <td>85</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Maths</td>
                <td>75</td>
                <td>B+</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>80</td>
                <td>A</td>
            </tr>
         </tbody>
    </table>
</body>
</html>
