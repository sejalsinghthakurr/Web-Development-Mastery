<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags in HTML></title>
</head>
<body>
    <h1><b><u>CONTENT</u></b></h1>
    <!-- ANCHOR ELEMENT-->
    <a href="https://www.netflix.com/in/">Netflix</a> <br>
    <a href="https://www.google.com/">Google</a> <br>

    <!-- IMAGE ELEMENT -->
    <img src="E:\Web Development\Code with Sejal\ironman.jpg" alt="Ironman Image" height="300px" width="300px">
    <!--This is a poem-->
    <!-- ctrl+/ -->
    <p>Twinkle Twinkle little star how I wonder what you are</p>
    <p><b>Twinkle Twinkle little star</b><br><i> how I wonder</i><br> <u>what you are</u></p>
    <div>
        <!--DIV ELEMENT GROUPS TAGS INTO SEPERATE BLOCK-->
        <a href="www.google.com">Google</a>
        <a href="www.youtube.com">Youtube</a>
    </div>
    <a href="www.facebook.com">Facebook</a> 
    <span>
        <!--SPAN ELEMENT GROUPS TAGS INTO SEPERATE BLOCK BUT IN SAME LINE
        IT IS MOSTLY USED FOR APPLING SYLE IN THE SELECTED TAGS-->
        <a href="www.google.com">Google</a>
        <a href="www.youtube.com">Youtube</a>
    </span>
    <a href="www.facebook.com">Facebook</a>

    <h3>43<sup>2</sup></h3>
    <p>H<sub>2</sub>O</p>
</body>
